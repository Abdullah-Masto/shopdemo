
name: shopdemo

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:8084:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - frontend
    restart: on-failure:5

  api:
    build: .
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

    # Security
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Resources
    mem_limit: 512m
    restart: on-failure:5

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - products_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: on-failure:5

networks:
  frontend:
  backend:
    internal: true

volumes:
  products_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt

